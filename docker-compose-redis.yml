version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis-cdc
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdc-network

volumes:
  redis_data:
  # redis_insight_data:

networks:
  cdc-network:

